<p-card header="Genres Module" class="full-width-card">
    <p-panel header="Add Genre" [toggleable]="true" [collapsed]="false">
        <form [formGroup]="genreForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex items-center gap-2">
                <label for="genreName" class="w-[100px] flex justify-between shrink-0">Name <span>:</span></label>
                <input id="genreName" pInputText pSize="small" formControlName="genreName" class="w-full" />
            </div>

            <div class="flex items-center gap-2">
                <label for="genreName" class="w-[100px] flex justify-between shrink-0">Shortname <span>:</span></label>
                <input id="genreShortname" pInputText pSize="small" formControlName="genreShortname" class="w-[40px]" />
            </div>

            <div class="flex gap-4">
                <p-button label="Clear" icon="pi pi-refresh" severity="warn" size="small" class="w-[100px] shrink-0" (click)="clearForm()"
                    (keydown)="clearForm()" />
                <p-button label="Submit" icon="pi pi-plus" severity="info" size="small" class="w-[100px] shrink-0" (click)="addGenre()"
                    (keydown)="addGenre()" />
            </div>
        </form>
    </p-panel>

    <p-table [value]="genres" [tableStyle]="{ 'width': '100%' }">
        <ng-template #header>
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Name</th>
                <th scope="col">Short Name</th>
                <th scope="col">Edit</th>
                <th scope="col">Delete</th>
            </tr>
        </ng-template>
        <ng-template #body let-genre>
            <tr>
                <td>{{ genre.genreIg }}</td>
                <td>{{ genre.genreName }}</td>
                <td>{{ genre.genreShortname }}</td>
                <td>
                    <p-button icon="pi pi-pencil" aria-label="Edit" />
                </td>
                <td>
                    <p-button icon="pi pi-trash" aria-label="Delete" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</p-card>
